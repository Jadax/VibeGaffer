name: Fetch FPL Data

on:
  schedule:
    # Runs every 30 min, but the guard below decides whether to actually fetch.
    # Cadence is deadline-aware: frequent near a deadline, sparse otherwise.
    - cron: '*/30 * * * *'
  workflow_dispatch:          # Manual trigger from GitHub UI
  push:
    paths:
      - '.github/workflows/fetch-data.yml'  # Rerun when workflow changes

# Two runs rewriting the same 1.3 MB JSON will always conflict on rebase,
# so never let them overlap. Queue instead of cancelling: a skipped run is
# a skipped data refresh.
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0   # guard needs commit timestamps for docs/data

      # Data only moves meaningfully around deadlines (prices, injury news,
      # fixture changes). A flat 15-minute cron produced ~13 commits/day of
      # churn on a 1.3 MB file. This throttles to what the data actually needs.
      - name: Decide whether to fetch
        id: guard
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time

          def emit(fetch, why):
              print(f"{'FETCH' if fetch else 'SKIP'}: {why}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"fetch={'true' if fetch else 'false'}\n")
              raise SystemExit(0)

          if os.environ.get('GITHUB_EVENT_NAME') != 'schedule':
              emit(True, 'manual or push trigger')

          try:
              bootstrap = json.load(open('docs/data/bootstrap.json'))
          except Exception as e:
              emit(True, f'cannot read existing bootstrap ({e}) - refresh it')

          now = int(time.time())
          hours_until = None
          for ev in bootstrap.get('events', []):
              if not ev.get('finished') and ev.get('deadline_time_epoch'):
                  hours_until = (ev['deadline_time_epoch'] - now) / 3600
                  print(f"Next unfinished GW{ev.get('id')} deadline in {hours_until:.1f}h")
                  break

          # How long since the data last actually changed
          try:
              last = int(subprocess.check_output(
                  ['git', 'log', '-1', '--format=%ct', '--', 'docs/data/bootstrap.json'],
                  text=True).strip())
              age_h = (now - last) / 3600
          except Exception:
              age_h = 999
          print(f'Existing data is {age_h:.1f}h old')

          if hours_until is None:
              emit(age_h >= 12, 'no upcoming deadline - daily refresh only')
          if 0 <= hours_until <= 6:
              emit(True, 'inside 6h deadline window - track price/news changes')
          if 0 <= hours_until <= 36:
              emit(age_h >= 2, 'inside 36h deadline window - 2-hourly')
          emit(age_h >= 6, 'outside deadline window - 6-hourly')
          PY

      # -f makes curl fail on HTTP errors, so the `||` proxy fallbacks actually
      # fire instead of writing an error page over the data file.
      - name: Fetch FPL bootstrap-static
        if: steps.guard.outputs.fetch == 'true'
        run: |
          mkdir -p docs/data
          curl -sfL -o docs/data/bootstrap.json \
            -H "User-Agent: Mozilla/5.0 (compatible; VibeGaffer/1.0)" \
            "https://fantasy.premierleague.com/api/bootstrap-static/" || \
          curl -sfL -o docs/data/bootstrap.json \
            "https://corsproxy.io/?$(printf '%s' 'https://fantasy.premierleague.com/api/bootstrap-static/')" || \
          curl -sfL -o docs/data/bootstrap.json \
            "https://api.allorigins.win/raw?url=https%3A%2F%2Ffantasy.premierleague.com%2Fapi%2Fbootstrap-static%2F"

      - name: Fetch FPL fixtures
        if: steps.guard.outputs.fetch == 'true'
        run: |
          curl -sfL -o docs/data/fixtures.json \
            -H "User-Agent: Mozilla/5.0 (compatible; VibeGaffer/1.0)" \
            "https://fantasy.premierleague.com/api/fixtures/" || \
          curl -sfL -o docs/data/fixtures.json \
            "https://corsproxy.io/?$(printf '%s' 'https://fantasy.premierleague.com/api/fixtures/')"

      - name: Validate JSON
        if: steps.guard.outputs.fetch == 'true'
        run: |
          python3 - <<'PY'
          import json, sys

          bootstrap = json.load(open('docs/data/bootstrap.json'))
          players = len(bootstrap.get('elements', []))
          teams = len(bootstrap.get('teams', []))
          if players < 400 or teams != 20:
              sys.exit(f'Implausible bootstrap: {players} players, {teams} teams')
          print(f'OK: {players} players, {teams} teams')

          fixtures = json.load(open('docs/data/fixtures.json'))
          if not isinstance(fixtures, list) or len(fixtures) < 300:
              sys.exit(f'Implausible fixtures: {type(fixtures).__name__}')
          print(f'OK: {len(fixtures)} fixtures')
          PY

      - name: Commit and push if changed
        if: steps.guard.outputs.fetch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: auto-fetch FPL data [skip ci]"

          # These files are generated wholesale, so a rebase against a
          # competing refresh conflicts every time. On rejection, take the
          # remote tip and replay our freshly fetched data on top of it.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected — replaying data onto the new remote tip"
            cp docs/data/bootstrap.json /tmp/bootstrap.json
            cp docs/data/fixtures.json /tmp/fixtures.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/bootstrap.json docs/data/bootstrap.json
            cp /tmp/fixtures.json docs/data/fixtures.json
            git add docs/data/
            if git diff --staged --quiet; then
              echo "Remote already has this data"
              exit 0
            fi
            git commit -m "data: auto-fetch FPL data [skip ci]"
          done
          echo "Could not push after 3 attempts"
          exit 1
