name: Fetch Bookmaker Odds

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours — guard skips most runs
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check if odds fetch needed
        id: check
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "No ODDS_API_KEY secret set — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 -c "
          import json, time, sys, os

          # Load bootstrap to find next GW deadline
          try:
              bootstrap = json.load(open('docs/data/bootstrap.json'))
          except:
              print('Cannot read bootstrap.json — skipping')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=true\n')
              sys.exit(0)

          now = int(time.time())
          events = bootstrap.get('events', [])

          # Find the next unfinished GW (current or upcoming)
          next_deadline = None
          next_gw_id = None
          for ev in events:
              if not ev.get('finished') and not ev.get('is_previous'):
                  next_deadline = ev.get('deadline_time_epoch')
                  next_gw_id = ev.get('id')
                  break

          if not next_deadline:
              print('No upcoming GW found — skipping')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=true\n')
              sys.exit(0)

          hours_until = (next_deadline - now) / 3600
          print(f'Next GW{next_gw_id} deadline in {hours_until:.1f}h')

          if hours_until > 30 or hours_until < 0:
              print(f'Outside fetch window (need <=30h, got {hours_until:.1f}h) — skipping')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=true\n')
              sys.exit(0)

          print(f'Inside fetch window — will fetch odds')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('skip=false\n')
          " || echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Fetch odds from The-Odds-API
        if: steps.check.outputs.skip != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p docs/data
          curl -sL -o /tmp/odds_raw.json \
            "https://api.the-odds-api.com/v4/sports/soccer_epl/odds/?apiKey=${ODDS_API_KEY}&regions=uk&markets=h2h,spreads,totals&bookmakers=bet365,pinnacle,betfair_ex_uk"

          if [ ! -s /tmp/odds_raw.json ]; then
            echo "Empty response from odds API"
            exit 0
          fi

          python3 -c "
          import json, sys, os

          try:
              with open('/tmp/odds_raw.json') as f:
                  odds_data = json.load(f)
              if not isinstance(odds_data, list):
                  print('Response not a list:', type(odds_data))
                  sys.exit(0)
          except json.JSONDecodeError as e:
              print(f'Invalid JSON: {e}')
              sys.exit(0)

          try:
              bootstrap = json.load(open('docs/data/bootstrap.json'))
              team_map = {}
              for t in bootstrap.get('teams', []):
                  team_map[t['name'].lower()] = t['short_name']
                  team_map[t.get('short_name','').lower()] = t['short_name']
          except:
              team_map = {}

          aliases = {
              'manchester city': 'MCI', 'man city': 'MCI', 'city': 'MCI',
              'manchester united': 'MUN', 'man utd': 'MUN', 'manchester utd': 'MUN',
              'liverpool': 'LIV', 'liverpool fc': 'LIV',
              'arsenal': 'ARS', 'arsenal fc': 'ARS',
              'chelsea': 'CHE', 'chelsea fc': 'CHE',
              'tottenham': 'TOT', 'tottenham hotspur': 'TOT', 'spurs': 'TOT',
              'newcastle': 'NEW', 'newcastle united': 'NEW',
              'aston villa': 'AVL', 'villa': 'AVL',
              'brighton': 'BHA', 'brighton & hove albion': 'BHA', 'brighton and hove albion': 'BHA',
              'west ham': 'WHU', 'west ham united': 'WHU',
              'crystal palace': 'CRY', 'palace': 'CRY',
              'wolves': 'WOL', 'wolverhampton': 'WOL', 'wolverhampton wanderers': 'WOL',
              'fulham': 'FUL', 'fulham fc': 'FUL',
              'bournemouth': 'BOU', 'afc bournemouth': 'BOU',
              'brentford': 'BRE', 'brentford fc': 'BRE',
              'nottingham forest': 'NFO', 'nottm forest': 'NFO', 'forest': 'NFO',
              'everton': 'EVE', 'everton fc': 'EVE',
              'burnley': 'BUR',
              'luton': 'LUT', 'luton town': 'LUT',
              'sheffield utd': 'SHU', 'sheffield united': 'SHU',
              'ipswich': 'IPS', 'ipswich town': 'IPS',
              'leicester': 'LEI', 'leicester city': 'LEI',
              'sunderland': 'SUN', 'sunderland afc': 'SUN'
          }
          team_map.update(aliases)

          def find_team_id(name):
              name_lower = name.lower().strip()
              if name_lower in team_map:
                  return team_map[name_lower]
              for key, val in team_map.items():
                  if key in name_lower or name_lower in key:
                      return val
              return name

          mapped = []
          for event in odds_data:
              home = find_team_id(event.get('home_team', ''))
              away = find_team_id(event.get('away_team', ''))
              h2h = {}
              totals = {}
              for bookmaker in event.get('bookmakers', []):
                  for market in bookmaker.get('markets', []):
                      if market['key'] == 'h2h' and market.get('outcomes'):
                          for o in market['outcomes']:
                              if o['name'] == event.get('home_team', ''): h2h['home'] = float(o['price'])
                              elif o['name'] == event.get('away_team', ''): h2h['away'] = float(o['price'])
                              elif o['name'] == 'Draw': h2h['draw'] = float(o['price'])
                      elif market['key'] == 'totals' and market.get('outcomes'):
                          for o in market['outcomes']:
                              if o['name'] == 'Over':
                                  totals['point'] = float(o['point'])
                                  totals['over'] = float(o['price'])
                              elif o['name'] == 'Under':
                                  totals['point'] = float(o['point'])
                                  totals['under'] = float(o['price'])
              if h2h:
                  mapped.append({
                      'home': home, 'away': away,
                      'commence_time': event.get('commence_time', ''),
                      'h2h': h2h,
                      'totals': totals
                  })

          with open('docs/data/odds.json', 'w') as f:
              json.dump(mapped, f)
          print(f'OK: {len(mapped)} fixtures with odds')
          "

      - name: Commit and push if changed
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/odds.json
          if git diff --staged --quiet; then
            echo "No odds changes"
            exit 0
          fi
          git commit -m "data: auto-fetch bookmaker odds [skip ci]"
          # This file is only ever touched by this workflow, so a rejected
          # push means another run of THIS workflow (or an unrelated commit)
          # landed first — a plain rebase resolves it, no replay needed.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          echo "Could not push after 3 attempts"
          exit 1
